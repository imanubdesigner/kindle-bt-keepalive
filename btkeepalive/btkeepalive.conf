# BT Keepalive configuration
# ─────────────────────────────────────────────────────────
# Location: /mnt/us/btkeepalive/btkeepalive.conf
# ─────────────────────────────────────────────────────────

# MAC address of your Bluetooth headphones.
# Find it by pairing your device first, then tap "Get MAC Address" 
# in the KUAL or KOReader menu. Replace the placeholder below:
# Example: MAC="75:c8:28:1a:12:b2"
#
MAC="XX:XX:XX:XX:XX:XX"

# Minimum battery percentage before the Kindle is allowed to sleep
# and reconnection is paused (used only in Always On mode).
# Recommended: 20
#
THRESHOLD=20

# Full path to the log file.
# The directory will be created automatically if it does not exist.
#
LOGFILE="/mnt/us/btkeepalive/log/btkeepalive.log"
