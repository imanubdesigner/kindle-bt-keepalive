# BT Keepalive configuration
# ─────────────────────────────────────────────────────────
# This is the only file you need to edit.
# It lives at /mnt/us/btkeepalive/btkeepalive.conf on the Kindle.
# Changes are picked up the next time you choose a mode in KUAL or KOReader.
# ─────────────────────────────────────────────────────────

# MAC address of your Bluetooth headphones.
# Pair the device first (Settings -> Bluetooth), then tap
# "Get MAC Address" in the KUAL or KOReader menu.
# If this is missing or not a valid MAC, the service waits and tells you
# (check "Current Mode") instead of running with a wrong address.
#
MAC="XX:XX:XX:XX:XX:XX"

# Always On mode only: below this battery percentage (and not charging)
# the sleep lock is released and the Kindle may sleep again. Always On resumes
# by itself once charging starts or the battery is back to THRESHOLD + 5 %.
# Recommended: 20
#
THRESHOLD=20

# Full path to the log file.
# The directory will be created automatically if it does not exist.
# Logs are rotated to <name>.1 when they pass 256 KB.
#
LOGFILE="/mnt/us/btkeepalive/log/btkeepalive.log"

# Set to 1 to log every Bluetooth event the Kindle emits (very useful to find
# out what happens when headphones are switched off, go out of range, etc.).
# Leave at 0 for normal use: it makes the log grow much faster.
#
DEBUG_EVENTS=0
